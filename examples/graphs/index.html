<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bromaid graphs</title>
<style>
  /* The host page owns the tokens; bromaid only reads them. */
  :root{--bg:#0e1013;--card:#15181d;--raised:#1d2128;--bd2:#2d333d;--fg:#e7e9ec;--fa:#8b929d;
    --ok:#41b883;--run:#5a9cff;--ok-t:rgba(65,184,131,.14);--run-t:rgba(90,156,255,.14);
    --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:880px;margin:0 auto;padding:24px 16px}
  h1{font-size:18px;margin:0 0 4px} h2{font-size:15px;margin:32px 0 4px}
  p{color:var(--fa);margin:0 0 12px}
  .frame{border:1px solid var(--bd2);border-radius:12px;overflow:hidden;background:var(--card)}
  .bar{display:flex;gap:8px;align-items:center;margin:10px 0}
  button.ctl{background:var(--raised);color:var(--fg);border:1px solid var(--bd2);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
  #log{font-family:var(--font-mono);font-size:12px;color:var(--fa)}
  #chain{overflow-x:auto}
</style>
</head>
<body>
<main>
  <h1>Where things run</h1>
  <p>Column layout. Hover or Tab through nodes; Enter clicks. The core-api edge is deploying (state "run"); treetop is stopped.</p>
  <div class="bar">
    <button class="ctl" id="toggle">Toggle deploy</button>
    <button class="ctl" id="add">Add / remove an app</button>
    <span id="log"></span>
  </div>
  <div class="frame"><div id="home"></div></div>

  <h2>Chain highlight on the general layout</h2>
  <p>highlight: "chain". Hover a node: every ancestor and every descendant lights up.</p>
  <div class="frame"><div id="chain"></div></div>
</main>
<script src="./bundle.js"></script>
</body>
</html>
